  <div id="modal-root"></div><div id="toast" class="toast hidden" role="status"></div>
  <script>
  (() => {
    "use strict";
    const KEY = "together-wheel-offline-v1";
    const SPIN_MS = 5500;
    const MAX_WHEELS = 30;
    const MAX_ITEMS = 200;
    const PALETTES = {
      apricot:{name:"暖陶",action:"#cf6b4c",colors:["#E9B69B","#EAD59F","#B9CFB9","#B3CDD0","#D3C6D7","#E8C7C1","#CDD4AD","#D8BEA9"]},
      sage:{name:"青叶",action:"#4e8465",colors:["#B4D1BA","#D8DDAF","#A9CCC4","#DFCCB4","#C3CADB","#CFD8BF","#B9D6D0","#D7C7BD"]},
      ocean:{name:"海盐",action:"#44788b",colors:["#A9CDD8","#B7D8DE","#D6DFC4","#E9D4B5","#C4CADD","#AFCFD0","#D4E0D7","#DBCAC5"]},
      plum:{name:"莓紫",action:"#8e6b95",colors:["#D7BFD8","#E8C3CE","#CFD4AC","#B6CED3","#E4D2B6","#CEC3DA","#D7C9BE","#BFD0C5"]}
    };
    const $ = (selector) => document.querySelector(selector);
    const icon = (name, className="icon") => `<svg class="${className}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[ch]);
    const id = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(36).slice(2));
    const starter = () => { const wheelId=id(); return {version:1,theme:"light",activeWheelId:wheelId,wheels:[{id:wheelId,name:"今天吃什么？",description:"把想吃的放进来，让转盘替你做决定。",palette:"apricot",items:["火锅","拉面","寿司"].map(name=>({id:id(),name,image:null,selected:true})),lastResult:null}]}; };
    let storageUnavailable = false;
    function load(){ try{const raw=localStorage.getItem(KEY);if(!raw)return starter();const parsed=JSON.parse(raw);if(parsed?.version!==1||!Array.isArray(parsed.wheels))throw Error("Invalid data");return parsed;}catch(error){storageUnavailable=error?.name==="SecurityError";return starter();} }
    let data=load();
    const ui={menu:false,spinning:false,angle:0,modal:null,editingWheelId:null,editingItemId:null,draftPalette:"apricot",draftImage:null,draftName:null,addImage:null,uploadFile:null,uploadUrl:null,uploadTarget:null,returnModal:null,toastTimer:null};
    function wheel(){return data.wheels.find(w=>w.id===data.activeWheelId)||data.wheels[0]||null;}
    function commit(next){try{localStorage.setItem(KEY,JSON.stringify(next));data=next;storageUnavailable=false;return true;}catch(error){storageUnavailable=true;toast(error?.name==="QuotaExceededError"?"本地存储空间不足。请压缩图片或清理数据。":"浏览器未允许本地存储，本次修改未保存。");return false;}}
    function toast(message){const el=$("#toast");el.textContent=message;el.classList.remove("hidden");clearTimeout(ui.toastTimer);ui.toastTimer=setTimeout(()=>el.classList.add("hidden"),3600);}
    function bytes(value){if(value<1024)return value+" B";if(value<1024*1024)return (value/1024).toFixed(1)+" KB";return (value/1024/1024).toFixed(2)+" MB";}
    function usage(){let raw=null;try{raw=localStorage.getItem(KEY);}catch{}const total=raw?(KEY.length+raw.length)*2:0;let imageBytes=0,images=0,items=0;for(const w of data.wheels)for(const item of w.items){items++;if(item.image){images++;if(raw)imageBytes+=item.image.length*2;}}return {total,imageBytes,other:Math.max(0,total-imageBytes),images,items};}
    function applyTheme(){document.documentElement.dataset.theme=data.theme==="dark"?"dark":"light";$("#theme-button").setAttribute("aria-label",data.theme==="dark"?"切换亮色模式":"切换暗色模式");$("#theme-button").innerHTML=icon(data.theme==="dark"?"sun":"moon");}
    function sector(index,count){const step=2*Math.PI/count,start=-Math.PI/2-step/2+index*step,end=start+step;const x1=300+281*Math.cos(start),y1=300+281*Math.sin(start),x2=300+281*Math.cos(end),y2=300+281*Math.sin(end);return `M300 300 L${x1} ${y1} A281 281 0 ${step>Math.PI?1:0} 1 ${x2} ${y2} Z`;}
    function placeLabels(angle,selected){const labels=$("#wheel-labels").children,normalized=((angle%360)+360)%360;for(let i=0;i<labels.length;i++){const r=(-90+i*360/selected.length+normalized)*Math.PI/180;labels[i].style.left=(50+34*Math.cos(r))+"%";labels[i].style.top=(50+34*Math.sin(r))+"%";}}
    function picture(item,kind){return item.image?`<img class="${kind}" src="${escapeHtml(item.image)}" alt="">`:`<span class="${kind}">${icon(wheel().name==="今天吃什么？"?"bowl":"choice")}</span>`;}
    function renderMenu(){const w=wheel(),palette=PALETTES[w?.palette]||PALETTES.apricot;$("#picker-name").textContent=w?.name||"暂无转盘";$("#picker-name").title=w?.name||"暂无转盘";$("#wheel-dot").style.background=w?palette.colors[0]:"var(--line)";$("#wheel-total").textContent=data.wheels.length;$("#menu-count").textContent=data.wheels.length+" 张 · 仅本机";$("#menu-search").classList.toggle("hidden",data.wheels.length<=6);filterMenu();$("#wheel-picker").disabled=!w;$("#wheel-picker").setAttribute("aria-expanded",String(ui.menu));$("#wheel-menu").classList.toggle("hidden",!ui.menu);document.querySelector('[data-action="edit-wheel"]').disabled=!w;}
    function filterMenu(){const q=$("#menu-search").value.trim().toLocaleLowerCase();const matches=data.wheels.filter(w=>w.name.toLocaleLowerCase().includes(q));$("#menu-list").innerHTML=matches.length?matches.map(w=>`<button type="button" class="menu-item ${w.id===data.activeWheelId?"active":""}" data-action="switch-wheel" data-id="${w.id}"><span class="menu-swatch" style="background:${PALETTES[w.palette]?.colors[0]||PALETTES.apricot.colors[0]}"></span><span class="menu-copy"><strong title="${escapeHtml(w.name)}">${escapeHtml(w.name)}</strong><small title="${escapeHtml(w.description)}">${escapeHtml(w.description||"还没有说明")}</small></span>${w.id===data.activeWheelId?"<em>当前</em>":""}</button>`).join(""):'<p class="menu-empty">没有找到匹配的转盘</p>';}
    function renderWheel(){const current=wheel();if(!current){$("#wheel-panel").style.setProperty("--wheel-action","var(--accent)");$("#wheel-title").textContent="还没有转盘";$("#wheel-title").title="还没有转盘";$("#wheel-description").textContent="创建一张转盘，开始添加你的选项。";$("#wheel-description").title="";$("#wheel-svg").setAttribute("aria-label","尚未创建转盘");$("#wheel-rotor").innerHTML=`<circle cx="300" cy="300" r="281" class="wheel-empty"/>`;$("#wheel-rotor").style.transform="rotate(0deg)";$("#wheel-labels").className="wheel-labels";$("#wheel-labels").innerHTML="";$("#wheel-center").innerHTML=icon("choice");$("#wheel-empty-note").classList.remove("hidden");$("#wheel-empty-note").textContent="从新建转盘开始";$("#spin-button").dataset.action="new-wheel";$("#spin-button").disabled=false;$("#spin-button").textContent="新建转盘";$("#spin-hint").textContent="创建后即可添加选项";return;}$("#spin-button").dataset.action="spin";const w=current,selected=w.items.filter(i=>i.selected),count=selected.length,palette=PALETTES[w.palette]||PALETTES.apricot;$("#wheel-panel").style.setProperty("--wheel-action",palette.action);$("#wheel-title").textContent=w.name;$("#wheel-title").title=w.name;$("#wheel-description").textContent=w.description||"把选项放进来，让转盘替你做决定。";$("#wheel-description").title=w.description;$("#wheel-svg").setAttribute("aria-label",count?`包含 ${count} 个选项的转盘`:"空转盘");const shapes=count===0?'<circle cx="300" cy="300" r="281" class="wheel-empty"/>':count===1?`<circle cx="300" cy="300" r="281" fill="${palette.colors[0]}"/>`:selected.map((item,i)=>`<path class="wheel-sector" d="${sector(i,count)}" fill="${palette.colors[i%palette.colors.length]}"/>`).join("");$("#wheel-rotor").innerHTML=shapes;$("#wheel-rotor").style.transform=`rotate(${ui.angle}deg)`;$("#wheel-labels").className="wheel-labels"+(count>8?" dense":"");$("#wheel-labels").innerHTML=count<=16?selected.map(item=>`<div class="wheel-label">${count<=6?picture(item,"wheel-thumb"):""}<span>${escapeHtml(item.name)}</span></div>`).join(""):"";if(count<=16)placeLabels(ui.angle,selected);$("#wheel-center").innerHTML=count>16?`<span class="wheel-count">${count}<small>个选项</small></span>`:'<svg viewBox="0 0 44 44" fill="none" aria-hidden="true"><path d="M21 4C12 4 5 11 5 20c0 4 1 7 3 10l13-8V4Z" fill="#F6BC77"/><path d="M23 4v18l14 8c2-3 3-6 3-10C40 11 33 4 23 4Z" fill="#ED7A60"/><path d="m9 32 13-8 13 8c-3 5-8 8-13 8s-10-3-13-8Z" fill="#A9CBB7"/><circle cx="22" cy="22" r="4" fill="#FFFDF7"/></svg>';$("#wheel-empty-note").classList.toggle("hidden",count!==0);$("#wheel-empty-note").textContent=w.items.length?"勾选想转的选项":"先添加一个选项";$("#spin-button").disabled=count<2||ui.spinning;$("#spin-button").textContent=ui.spinning?"转动中…":"开始转盘";$("#spin-hint").textContent=count<2?"至少勾选两个选项才能开始":count>16?"选项较多，完整名称见候选列表":"结果只保存在这台设备";}
    function renderItems(){const w=wheel();$("#add-form").classList.toggle("hidden",!w);$(".list-head").classList.toggle("hidden",!w);if(!w){$("#item-count").textContent="00";$("#selected-count").textContent="";$("#items").innerHTML=`<div class="empty-state"><span class="empty-icon">${icon("choice")}</span><h3>创建第一张转盘</h3><p>给你的选择一个名字，再添加候选项。</p><button type="button" class="button-primary" data-action="new-wheel">新建转盘</button></div>`;$("#header-usage").textContent=bytes(usage().total);$("#aside-usage").textContent=bytes(usage().total);return;}const selected=w.items.filter(i=>i.selected).length;$("#item-count").textContent=String(w.items.length).padStart(2,"0");$("#selected-count").textContent=`已选 ${selected} / ${w.items.length}`;$("#items").innerHTML=w.items.length?w.items.map((item,index)=>`<li class="${item.selected?"":"unselected"}"><span class="item-no">${String(index+1).padStart(2,"0")}</span>${item.image?`<button type="button" class="item-photo clickable" data-action="view-item-image" data-id="${item.id}" aria-label="查看${escapeHtml(item.name)}完整图片">${picture(item,"item-photo")}</button>`:picture(item,"item-photo")}<span class="item-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</span><label class="selection" title="${item.selected?"从转盘移除":"选入转盘"}"><input type="checkbox" data-item-id="${item.id}" ${item.selected?"checked":""} ${ui.spinning?"disabled":""} aria-label="将${escapeHtml(item.name)}选入转盘"><span>${item.selected?"已选":"未选"}</span></label><button type="button" class="edit-link" data-action="edit-item" data-id="${item.id}" ${ui.spinning?"disabled":""}>编辑</button></li>`).join(""):'<div class="empty-state"><span class="empty-icon">'+icon(w.name==="今天吃什么？"?"bowl":"choice")+'</span><h3>这个转盘还没有选项</h3><p>先添加一个想法，再开始转动。</p></div>';$("#add-button").disabled=ui.spinning;$("#new-item-name").disabled=ui.spinning;$("#upload-label").textContent=ui.addImage?"已选择图片，可重新选择":"上传选项图片，可选";$("#add-preview").innerHTML=ui.addImage?`<button type="button" class="preview-link" data-action="view-add-image"><img src="${escapeHtml(ui.addImage)}" alt=""><span>查看完整图片</span></button><button type="button" class="remove-add-image" data-action="remove-add-image">移除图片</button>`:"";const size=usage();$("#header-usage").textContent=bytes(size.total);$("#aside-usage").textContent=bytes(size.total);}
    function render(){applyTheme();renderMenu();renderWheel();renderItems();}
    function closeMenu(){ui.menu=false;renderMenu();}
    function resetModal(){ui.modal=null;ui.returnModal=null;$("#modal-root").innerHTML="";document.body.style.overflow="";}
    function showModal(name,body){ui.modal=name;document.body.style.overflow="hidden";$("#modal-root").innerHTML=`<div class="overlay" data-overlay><section class="dialog ${name==="result"?"result-dialog":""}" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${body}</section></div>`;requestAnimationFrame(()=>$("#modal-root input:not([type=file]),#modal-root button")?.focus());}
    function modalHead(title,subtitle=""){return `<div class="dialog-head"><div><h2 id="dialog-title">${title}</h2>${subtitle?`<p>${subtitle}</p>`:""}</div><button type="button" class="close" data-action="close-modal">关闭</button></div>`;}
    function paletteOptions(){return `<div class="palette-grid">${Object.entries(PALETTES).map(([key,p])=>`<button type="button" class="palette-option ${ui.draftPalette===key?"active":""}" data-action="palette" data-palette="${key}" aria-pressed="${ui.draftPalette===key}"><span class="palette-swatch" style="background:conic-gradient(${p.colors[0]} 0 120deg,${p.colors[1]} 120deg 240deg,${p.colors[2]} 240deg 360deg)"></span><span>${p.name}</span></button>`).join("")}</div>`;}
    function wheelDialog(isNew){if(ui.spinning)return toast("转盘转动结束后再编辑。");const w=isNew?null:wheel();ui.editingWheelId=w?.id||null;ui.draftPalette=w?.palette||"apricot";showModal("wheel",`${modalHead(isNew?"新建转盘":"编辑转盘",isNew?"给新的想法留一张专属转盘":"名称、说明与配色只保存在本地")}<form id="wheel-form"><label class="field" for="dialog-wheel-name">转盘名称</label><input class="text-input" id="dialog-wheel-name" maxlength="28" value="${escapeHtml(w?.name||"")}" placeholder="例如：周末去哪？" required><label class="field" for="dialog-wheel-description">一句说明 <span>可选</span></label><textarea class="text-area" id="dialog-wheel-description" maxlength="90" rows="2" placeholder="让自己知道这张转盘要决定什么">${escapeHtml(w?.description||"")}</textarea><div class="field">转盘配色</div>${paletteOptions()}<p class="dialog-error hidden" id="dialog-error"></p><div class="dialog-actions"><button type="button" class="button-secondary" data-action="close-modal">取消</button><button type="submit" class="button-primary">${isNew?"创建转盘":"保存修改"}</button></div></form>${w?'<button type="button" class="danger-link" data-action="confirm-delete-wheel">删除这张转盘</button>':""}`);}
    function itemDialog(itemId,preserveDraft=false){if(ui.spinning)return toast("转盘转动结束后再编辑。");const item=wheel().items.find(i=>i.id===itemId);if(!item)return;if(!preserveDraft||ui.editingItemId!==item.id){ui.draftImage=item.image;ui.draftName=item.name;}ui.editingItemId=item.id;showModal("item",`${modalHead("编辑选项","名称和图片可以随时修改") }<form id="item-form"><label class="field" for="dialog-item-name">选项名称</label><input class="text-input" id="dialog-item-name" maxlength="24" value="${escapeHtml(ui.draftName??item.name)}" required><div class="image-editor"><div class="image-frame">${ui.draftImage?`<img src="${escapeHtml(ui.draftImage)}" alt="当前图片裁剪预览">`:icon(wheel().name==="今天吃什么？"?"bowl":"choice")}</div><div class="image-actions"><strong>选项图片</strong><p>转盘与列表自动居中裁剪；可查看保存图片的完整画面。</p>${ui.draftImage?'<button type="button" data-action="view-draft-image">查看完整图片</button>':""}<button type="button" data-action="pick-edit-image">更换图片</button>${ui.draftImage?'<button type="button" data-action="remove-edit-image">移除图片</button>':""}</div></div><input id="edit-file" type="file" accept="image/png,image/jpeg,image/webp" class="hidden"><p class="dialog-error hidden" id="dialog-error"></p><div class="dialog-actions"><button type="button" class="button-secondary" data-action="close-modal">取消</button><button type="submit" class="button-primary">保存修改</button></div></form><button type="button" class="danger-link" data-action="confirm-delete-item">删除这个选项</button>`);}
    function imageDialog(src,title,back){ui.returnModal=back;showModal("image",`${modalHead(escapeHtml(title),"完整画面，不会被裁剪")}<img class="full-image" src="${escapeHtml(src)}" alt="${escapeHtml(title)}完整图片">`);}
    function uploadDialog(file,target){if(!["image/jpeg","image/png","image/webp"].includes(file.type))return toast("仅支持 JPG、PNG 或 WebP 图片。");if(file.size>20*1024*1024)return toast("图片超过 20 MB，请先缩小后再选择。");if(ui.uploadUrl)URL.revokeObjectURL(ui.uploadUrl);ui.uploadFile=file;ui.uploadTarget=target;ui.uploadUrl=URL.createObjectURL(file);showModal("upload",`${modalHead("保存选项图片","可保留原文件，或压缩后节省本地空间") }<img class="upload-image" src="${ui.uploadUrl}" alt="待处理的完整图片"><div class="quality-row"><strong>压缩画质</strong><span id="quality-value">82%</span></div><input class="quality-slider" id="quality-slider" type="range" min="45" max="95" value="82" aria-label="压缩画质"><p class="upload-note">原文件 ${bytes(file.size)}。压缩会把长边缩到最多 1400 像素，并保存为 WebP。浏览器的本地存储容量有限，建议较大的图片选择压缩。</p><p class="dialog-error hidden" id="dialog-error"></p><div class="dialog-actions"><button type="button" class="button-secondary" data-action="cancel-upload">取消</button><button type="button" class="button-secondary" data-action="keep-image" ${file.size>2*1024*1024?"disabled title=\"超过 2 MB，请压缩后使用\"":""}>保留原图</button><button type="button" class="button-primary" data-action="compress-image">压缩后使用</button></div>`);}
    function afterUpload(){const target=ui.uploadTarget;if(ui.uploadUrl)URL.revokeObjectURL(ui.uploadUrl);ui.uploadUrl=null;ui.uploadFile=null;ui.uploadTarget=null;if(target==="edit")itemDialog(ui.editingItemId,true);else{resetModal();renderItems();}}
    function cancelUpload(){if(ui.uploadUrl)URL.revokeObjectURL(ui.uploadUrl);ui.uploadUrl=null;const target=ui.uploadTarget;ui.uploadFile=null;ui.uploadTarget=null;if(target==="edit")itemDialog(ui.editingItemId,true);else resetModal();}
    function closeCurrentModal(){if(ui.modal==="upload")return cancelUpload();const back=ui.returnModal;ui.returnModal=null;if(back==="item")return itemDialog(ui.editingItemId,true);resetModal();}
    async function asDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error("无法读取图片"));reader.readAsDataURL(file);});}
    async function compress(file,quality){const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const scale=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL("image/webp",quality);}finally{URL.revokeObjectURL(url);}}
    function setUploadResult(src){if(ui.uploadTarget==="edit")ui.draftImage=src;else ui.addImage=src;afterUpload();toast("图片已准备好，保存选项后会写入本地存储。");}
    function storageDialog(){const size=usage();showModal("storage",`${modalHead("本地存储","这些数据只存在当前浏览器中") }<div class="storage-hero"><span>当前应用约占用</span><strong>${bytes(size.total)}</strong></div><div class="storage-breakdown"><span>图片数据</span><strong>${bytes(size.imageBytes)}</strong><span>名称、选项与设置</span><strong>${bytes(size.other)}</strong><span>转盘数量</span><strong>${data.wheels.length} 张</strong><span>选项 / 图片</span><strong>${size.items} 项 / ${size.images} 张</strong></div><p class="storage-note">按本应用写入 localStorage 的 UTF-16 字符大小估算；浏览器实际配额因环境而异。清除操作只影响本应用，不会删除其他网站的数据。${storageUnavailable?" 当前浏览器可能限制本地存储，请检查权限。":""}</p><button type="button" class="danger-link" data-action="confirm-clear">清除本应用全部数据</button>`);}
    function confirmDialog(kind){const isAll=kind==="all",isWheel=kind==="wheel";const title=isAll?"清除全部本地数据？":isWheel?"删除这张转盘？":"删除这个选项？";const detail=isAll?"所有转盘、图片和设置都会从这个浏览器删除，无法撤销。":isWheel?`“${escapeHtml(wheel().name)}”及其中所有选项、图片都会删除。`:`“${escapeHtml(wheel().items.find(i=>i.id===ui.editingItemId)?.name||"")}”会从当前转盘删除。`;showModal("confirm",`${modalHead(title,detail)}<div class="dialog-actions"><button type="button" class="button-secondary" data-action="cancel-confirm" data-kind="${kind}">取消</button><button type="button" class="button-primary danger-primary" data-action="delete-confirmed" data-kind="${kind}">确定${isAll?"清除":"删除"}</button></div>`);}
    function resultDialog(item){showModal("result",`${modalHead("转盘已经选好") }<div class="result-art">${item.image?`<img src="${escapeHtml(item.image)}" alt="">`:icon(wheel().name==="今天吃什么？"?"bowl":"choice")}</div><p class="result-lead">这次就选</p><h2 class="result-name">${escapeHtml(item.name)}</h2><p class="result-desc">结果已保存在这台设备。</p><button type="button" class="button-primary" data-action="close-modal">好，就它了</button>`);}
    function saveWheel(event){event.preventDefault();const name=$("#dialog-wheel-name").value.trim(),description=$("#dialog-wheel-description").value.trim();if(!name)return error("请填写转盘名称。");if(data.wheels.some(w=>w.id!==ui.editingWheelId&&w.name.toLocaleLowerCase()===name.toLocaleLowerCase()))return error("已有同名转盘，请换个名称。");if(!ui.editingWheelId&&data.wheels.length>=MAX_WHEELS)return error("最多可创建 30 张转盘。");const next=structuredClone(data);if(ui.editingWheelId){const w=next.wheels.find(w=>w.id===ui.editingWheelId);Object.assign(w,{name,description,palette:ui.draftPalette});}else{const w={id:id(),name,description,palette:ui.draftPalette,items:[],lastResult:null};next.wheels.push(w);next.activeWheelId=w.id;ui.angle=0;}if(commit(next)){resetModal();render();toast(ui.editingWheelId?"转盘已更新。":"新转盘已创建。");}}
    function saveItem(event){event.preventDefault();const name=$("#dialog-item-name").value.trim();if(!name)return error("请填写选项名称。");const w=wheel();if(w.items.some(i=>i.id!==ui.editingItemId&&i.name.toLocaleLowerCase()===name.toLocaleLowerCase()))return error("这张转盘已有同名选项。");const next=structuredClone(data),item=next.wheels.find(x=>x.id===w.id).items.find(i=>i.id===ui.editingItemId);item.name=name;item.image=ui.draftImage;if(commit(next)){resetModal();render();toast("选项已更新。");}}
    function addItem(event){event.preventDefault();if(ui.spinning)return;const name=$("#new-item-name").value.trim(),w=wheel();if(!name)return;if(w.items.length>=MAX_ITEMS)return toast("每张转盘最多 200 个选项。");if(w.items.some(i=>i.name.toLocaleLowerCase()===name.toLocaleLowerCase()))return toast("这张转盘已有同名选项。");const next=structuredClone(data);next.wheels.find(x=>x.id===w.id).items.push({id:id(),name,image:ui.addImage,selected:true});if(commit(next)){ui.addImage=null;$("#new-item-name").value="";render();toast("新选项已选入转盘。");}}
    function error(message){const el=$("#dialog-error");if(el){el.textContent=message;el.classList.remove("hidden");}else toast(message);}
    function spin(){if(ui.spinning)return;const selected=wheel().items.filter(i=>i.selected);if(selected.length<2)return toast("至少勾选两个选项才能转动。");ui.spinning=true;$("#spin-button").disabled=true;$("#spin-button").textContent="转动中…";renderItems();const random=new Uint32Array(1);crypto.getRandomValues(random);const winnerIndex=random[0]%selected.length,step=360/selected.length,start=ui.angle,extra=((360-(start%360)-winnerIndex*step)%360+360)%360,target=start+6*360+extra,duration=matchMedia("(prefers-reduced-motion: reduce)").matches?100:SPIN_MS,started=performance.now();function frame(now){const progress=Math.min(1,(now-started)/duration),eased=1-Math.pow(1-progress,3),angle=start+(target-start)*eased;$("#wheel-rotor").style.transform=`rotate(${angle}deg)`;if(selected.length<=16)placeLabels(angle,selected);if(progress<1){requestAnimationFrame(frame);return;}ui.angle=target;ui.spinning=false;const next=structuredClone(data);next.wheels.find(w=>w.id===data.activeWheelId).lastResult={itemId:selected[winnerIndex].id,name:selected[winnerIndex].name,at:Date.now()};commit(next);render();resultDialog(selected[winnerIndex]);}requestAnimationFrame(frame);}
    document.addEventListener("click",async event=>{const button=event.target.closest("[data-action]");if(!button)return;const action=button.dataset.action;if(action==="theme"){const next=structuredClone(data);next.theme=data.theme==="dark"?"light":"dark";if(commit(next)){applyTheme();renderItems();}return;}if(action==="new-wheel")return wheelDialog(true);if(action==="edit-wheel")return wheelDialog(false);if(action==="switch-wheel"){if(ui.spinning)return toast("转盘转动结束后再切换。");const next=structuredClone(data);next.activeWheelId=button.dataset.id;if(commit(next)){ui.angle=0;closeMenu();render();}return;}if(action==="spin")return spin();if(action==="storage")return storageDialog();if(action==="edit-item")return itemDialog(button.dataset.id);if(action==="pick-add-image")return $("#add-file").click();if(action==="remove-add-image"){ui.addImage=null;return renderItems();}if(action==="pick-edit-image")return $("#edit-file").click();if(action==="remove-edit-image"){ui.draftImage=null;return itemDialog(ui.editingItemId,true);}if(action==="view-item-image"){const item=wheel().items.find(i=>i.id===button.dataset.id);if(item?.image)return imageDialog(item.image,item.name,null);}if(action==="view-draft-image"&&ui.draftImage)return imageDialog(ui.draftImage,$("#dialog-item-name").value||"选项", "item");if(action==="view-add-image"&&ui.addImage)return imageDialog(ui.addImage,"待添加图片",null);if(action==="close-modal")return closeCurrentModal();if(action==="palette"){ui.draftPalette=button.dataset.palette;$("#modal-root").querySelectorAll(".palette-option").forEach(el=>{el.classList.toggle("active",el.dataset.palette===ui.draftPalette);el.setAttribute("aria-pressed",String(el.dataset.palette===ui.draftPalette));});return;}if(action==="confirm-delete-wheel")return confirmDialog("wheel");if(action==="confirm-delete-item")return confirmDialog("item");if(action==="confirm-clear")return confirmDialog("all");if(action==="cancel-confirm")return button.dataset.kind==="all"?storageDialog():button.dataset.kind==="wheel"?wheelDialog(false):itemDialog(ui.editingItemId,true);if(action==="delete-confirmed"){const kind=button.dataset.kind;if(kind==="all"){try{localStorage.removeItem(KEY);}catch{toast("无法清除浏览器存储，请检查权限。");return;}data=starter();ui.angle=0;ui.addImage=null;resetModal();render();return toast("本应用本地数据已全部清除，已恢复初始转盘。");}const next=structuredClone(data);if(kind==="wheel"){next.wheels=next.wheels.filter(w=>w.id!==data.activeWheelId);next.activeWheelId=next.wheels[0]?.id||null;ui.angle=0;ui.addImage=null;ui.menu=false;}else next.wheels.find(w=>w.id===data.activeWheelId).items=wheel().items.filter(i=>i.id!==ui.editingItemId);if(commit(next)){resetModal();render();toast(kind==="wheel"?"转盘已删除。":"选项已删除。");}return;}if(action==="cancel-upload")return cancelUpload();if(action==="keep-image"){try{const src=await asDataUrl(ui.uploadFile);setUploadResult(src);}catch{error("图片读取失败，请重试。");}return;}if(action==="compress-image"){button.disabled=true;button.textContent="压缩中…";try{const src=await compress(ui.uploadFile,Number($("#quality-slider").value)/100);if(src.length>3*1024*1024)throw Error("压缩后仍过大，请降低画质或换一张图片。");setUploadResult(src);}catch(err){error(err.message||"图片压缩失败，请重试。");button.disabled=false;button.textContent="压缩后使用";}return;}});
    document.addEventListener("submit",event=>{if(event.target.id==="add-form")addItem(event);else if(event.target.id==="wheel-form")saveWheel(event);else if(event.target.id==="item-form")saveItem(event);});
    document.addEventListener("change",event=>{if(event.target.id==="add-file"||event.target.id==="edit-file"){const file=event.target.files?.[0];event.target.value="";if(file)uploadDialog(file,event.target.id==="edit-file"?"edit":"add");}else if(event.target.matches("input[data-item-id]")){const itemId=event.target.dataset.itemId,next=structuredClone(data),item=next.wheels.find(w=>w.id===data.activeWheelId).items.find(i=>i.id===itemId);if(item){item.selected=event.target.checked;if(commit(next))render();else event.target.checked=!event.target.checked;}}});
    document.addEventListener("input",event=>{if(event.target.id==="menu-search")filterMenu();if(event.target.id==="quality-slider")$("#quality-value").textContent=event.target.value+"%";if(event.target.id==="dialog-item-name")ui.draftName=event.target.value;});
    $("#wheel-picker").addEventListener("click",()=>{ui.menu=!ui.menu;renderMenu();if(ui.menu&&data.wheels.length>6)$("#menu-search").focus();});
    document.addEventListener("pointerdown",event=>{if(ui.menu&&!$("#menu-anchor").contains(event.target))closeMenu();if(event.target.matches("[data-overlay]"))closeCurrentModal();});
    document.addEventListener("keydown",event=>{if(event.key!=="Escape")return;if(ui.menu)closeMenu();if(ui.modal)closeCurrentModal();});
    render();
    if(storageUnavailable)toast("当前浏览器可能不支持此文件的本地存储；请检查浏览器设置。");
  })();
  </script>
</body>
</html>
